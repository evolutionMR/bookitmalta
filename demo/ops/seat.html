<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Hosted demo — your bookings (per-seat)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..800&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#0B2545; --ink-soft:#1C3558; --paper:#F4EBD9; --paper-deep:#EBDFC6; --card:#FFFAF1;
  --terracotta:#C85C2E; --mute:rgba(11,37,69,.55); --rule:rgba(11,37,69,.15); --rule-strong:rgba(11,37,69,.35);
  --ok:#1B7A4B; --ok-bg:#D8F3DC; --warn:#7A5B00; --warn-bg:#FFF3D6; --err:#B3261E; --err-bg:rgba(179,38,30,.1);
  --serif:"Fraunces",Georgia,serif; --sans:"Manrope",-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh;padding:1rem 1rem 5rem;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
.demobar{display:flex;gap:.4rem;align-items:center;background:var(--ink);border-radius:8px;padding:.35rem .45rem;margin-bottom:.9rem}
.demobar span{color:var(--terracotta);font-family:var(--mono);font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;padding:0 .35rem}
.demobar a{flex:1;text-align:center;text-decoration:none;border-radius:6px;padding:.45rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--paper)}
.demobar a.on{font-weight:600;background:var(--paper);color:var(--ink)}
.proto-band{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:.35rem .5rem;border-radius:6px;margin-bottom:1rem}
header{padding-bottom:.8rem;border-bottom:1px solid var(--rule);margin-bottom:1rem}
.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terracotta);display:block}
h1{font-family:var(--serif);font-size:1.45rem;font-weight:380;line-height:1.15}
.sub{font-size:.82rem;color:var(--mute);margin-top:.15rem}
.count-strip{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:.2rem 0 .6rem}
.count-strip b{color:var(--terracotta)}

.row{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:.8rem .9rem;margin-bottom:.6rem;border-left:3px solid var(--rule-strong)}
.row.pending{border-left-color:var(--terracotta)}
.rname{font-weight:600;font-size:.98rem}
.rmeta{font-family:var(--mono);font-size:.68rem;color:var(--mute);margin-top:.2rem}
.acts{display:flex;gap:.5rem;margin-top:.8rem}
.btn{flex:1;border-radius:9px;padding:.6rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;cursor:pointer;border:1px solid var(--rule-strong)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.no{background:#fff;color:var(--err);border-color:var(--err)}
.hint{font-size:.8rem;color:var(--mute);margin-top:.7rem;line-height:1.5}
.empty{color:var(--mute);font-style:italic;font-size:.9rem;padding:1.4rem .2rem;text-align:center}
.calbtn{display:inline-block;margin-top:.7rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--terracotta);cursor:pointer;border:1px solid var(--rule-strong);border-radius:7px;padding:.4rem .65rem;background:#fff}
.callinks{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.callinks a{flex:1;min-width:78px;text-align:center;text-decoration:none;font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);border:1px solid var(--rule-strong);border-radius:7px;padding:.45rem .3rem;background:#fff}

.dep{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:.65rem .85rem;margin-bottom:.45rem}
.dep .top{display:flex;justify-content:space-between;align-items:center}
.dep .slot{font-family:var(--mono);font-weight:600;font-size:.85rem}
.dep .seats{font-family:var(--mono);font-size:.78rem;font-weight:600}
.dep .seats.ok{color:var(--ink-soft)} .dep .seats.warn{color:var(--warn)} .dep .seats.full{color:var(--ok)}
.bar{height:6px;border-radius:99px;background:var(--paper-deep);margin-top:.45rem;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok)}
.day-h{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:.9rem 0 .4rem}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;padding:.7rem .3rem;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;border-top:3px solid transparent;position:relative}
.tabs button.on{color:var(--terracotta);border-top-color:var(--terracotta);font-weight:600}
.tabs .badge{position:absolute;top:.45rem;margin-left:.2rem;background:var(--terracotta);color:#fff;border-radius:20px;font-size:.5rem;padding:.05rem .3rem;font-weight:700}
.reset{display:block;text-align:center;font-family:var(--mono);font-size:.62rem;color:var(--mute);margin:1.2rem auto 0;cursor:pointer;text-decoration:underline;background:none;border:0}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;border-radius:999px;padding:.55rem 1.1rem;font-family:var(--mono);font-size:.72rem;z-index:60;display:none;max-width:92vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="demobar">
    <span>Demo</span>
    <a href="charter.html">Whole-boat charter</a>
    <a href="seat.html" class="on">Per-seat</a>
  </div>
  <div class="proto-band">Hosted plan · what your screen looks like · demo data</div>
  <header>
    <span class="eyebrow">Sea Breeze Cruises</span>
    <h1>Your bookings</h1>
    <div class="sub">Seats sell online and confirm instantly. Phone &amp; walk-up enquiries land in Approvals. We handle payment and confirmation — you just keep an eye on the boat.</div>
  </header>
  <div id="view"></div>
  <button class="reset" id="resetBtn">Reset demo data</button>
</div>

<div class="tabs">
  <button id="tab-appr" class="on">Approvals</button>
  <button id="tab-cal">Calendar</button>
  <button id="tab-up">Upcoming</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* Hosted demo — per-seat. Cap 40 per boat × 2 boats = 80 per departure. */
var CAP=80, SLOTS=["09:30","14:30"];
var KEY="hosted-demo-seat-v1";
function iso(d){return d.toISOString().slice(0,10);}
function off(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d);}
function fmt(s){var d=new Date(s+"T12:00:00");var t=iso(new Date());var l=d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});return s===t?"Today · "+l:l;}
function seed(){
  return { pending:[
    {id:1,name:"Phone — Kowalski ×7",slot:"09:30",date:off(0),seats:7,via:"phone"},
    {id:2,name:"Walk-up — Chen",slot:"14:30",date:off(0),seats:3,via:"walk-up"}
  ],
  /* seats already sold online (auto-confirmed) per date|slot */
  sold:{} };
}
function load(){try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&s.pending)return s;}}catch(e){}var s=seed();
  // seed some sold seats
  s.sold[off(0)+"|09:30"]=51; s.sold[off(0)+"|14:30"]=72;
  s.sold[off(1)+"|09:30"]=18; s.sold[off(1)+"|14:30"]=33;
  s.sold[off(2)+"|09:30"]=40; s.sold[off(2)+"|14:30"]=12;
  return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
var store=load();
function soldOf(date,slot){return store.sold[date+"|"+slot]||0;}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none";},2800);}

var tab="appr";
function setTab(t){tab=t;["appr","cal","up"].forEach(function(k){document.getElementById("tab-"+k).className=(k===t?"on":"");});render();}
document.getElementById("tab-appr").onclick=function(){setTab("appr");};
document.getElementById("tab-cal").onclick=function(){setTab("cal");};
document.getElementById("tab-up").onclick=function(){setTab("up");};
document.getElementById("resetBtn").onclick=function(){try{localStorage.removeItem(KEY);}catch(e){}location.reload();};

function renderApprovals(el){
  el.innerHTML="<div class='count-strip'>Online bookings confirm automatically</div>"+
    "<div class='row'><div class='rname'>Nothing to approve 🎉</div><div class='rmeta'>Website seats are paid and confirmed instantly — they go straight onto your Calendar.</div></div>";
  var h=document.createElement("div");h.className="hint";
  h.innerHTML="On Hosted, every seat is sold through BookItMalta and confirmed automatically — nothing to chase, nothing to enter.<br><br><b>Add-on:</b> taking phone / walk-up / agent bookings yourself? We can switch on off-platform entry as a paid extra.";
  el.appendChild(h);
}

function renderCalendar(el){
  el.innerHTML="<div class='count-strip'>Next 7 days · seats fill automatically as customers pay online</div>";
  for(var i=0;i<7;i++){
    var date=off(i);
    var h=document.createElement("div");h.className="day-h";h.textContent=fmt(date);el.appendChild(h);
    SLOTS.forEach(function(slot){
      var sold=soldOf(date,slot), pct=Math.min(100,Math.round(sold/CAP*100));
      var cls=sold>=CAP?"full":(sold>=CAP*0.75?"warn":"ok");
      var lbl=sold>=CAP?"FULL":(CAP-sold)+" left";
      var d=document.createElement("div");d.className="dep";
      d.innerHTML="<div class='top'><span class='slot'>"+slot+"</span><span class='seats "+cls+"'>"+sold+"/"+CAP+" · "+lbl+"</span></div><div class='bar'><i style='width:"+pct+"%'></i></div>";
      el.appendChild(d);
    });
  }
}

function ymd(s){return s.replace(/-/g,"");}
function nextDay(s){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
function calLinks(title,date,details){
  var s=ymd(date), e=ymd(nextDay(date));
  var g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+s+"/"+e+"&details="+encodeURIComponent(details);
  var o="https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&subject="+encodeURIComponent(title)+"&startdt="+date+"&enddt="+nextDay(date)+"&allday=true&body="+encodeURIComponent(details);
  var ics="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//BookItMalta//demo//EN\nBEGIN:VEVENT\nUID:"+s+Math.random().toString(36).slice(2)+"@bookitmalta\nDTSTART;VALUE=DATE:"+s+"\nDTEND;VALUE=DATE:"+e+"\nSUMMARY:"+title+"\nDESCRIPTION:"+details+"\nEND:VEVENT\nEND:VCALENDAR";
  return { g:g, o:o, ics:"data:text/calendar;charset=utf-8,"+encodeURIComponent(ics) };
}
function renderUpcoming(el){
  var rows=[];
  for(var i=0;i<7;i++){var date=off(i);SLOTS.forEach(function(slot){var s=soldOf(date,slot);if(s>0)rows.push({date:date,slot:slot,seats:s});});}
  if(!rows.length){el.innerHTML="<div class='empty'>No departures booked yet.</div>";return;}
  el.innerHTML="<div class='count-strip'><b>"+rows.length+"</b> departures with bookings</div>";
  rows.forEach(function(x){
    var r=document.createElement("div");r.className="row";
    var L=calLinks("Sea Breeze Cruises — "+x.slot+" departure", x.date, x.seats+" of "+CAP+" seats sold · via BookItMalta");
    r.innerHTML="<div class='rname'>"+fmt(x.date)+" · "+x.slot+"</div><div class='rmeta'>"+x.seats+" of "+CAP+" seats sold</div>"+
      "<span class='calbtn'>＋ Add to calendar</span>"+
      "<div class='callinks' style='display:none'><a href='"+L.g+"' target='_blank' rel='noopener'>Google</a><a href='"+L.ics+"' download='departure.ics'>Apple</a><a href='"+L.o+"' target='_blank' rel='noopener'>Outlook</a></div>";
    r.querySelector(".calbtn").onclick=function(){var c=r.querySelector(".callinks");c.style.display=(c.style.display==="none")?"flex":"none";};
    el.appendChild(r);
  });
}

function render(){
  var n=store.pending.length;
  document.getElementById("tab-appr").innerHTML="Approvals"+(n?" <span class='badge'>"+n+"</span>":"");
  var el=document.getElementById("view");
  if(tab==="appr")renderApprovals(el);
  else if(tab==="cal")renderCalendar(el);
  else renderUpcoming(el);
}
render();
</script>
</body>
</html>
