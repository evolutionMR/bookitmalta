<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Hosted demo — your bookings (charter)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..800&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#0B2545; --ink-soft:#1C3558; --paper:#F4EBD9; --paper-deep:#EBDFC6; --card:#FFFAF1;
  --terracotta:#C85C2E; --mute:rgba(11,37,69,.55); --rule:rgba(11,37,69,.15); --rule-strong:rgba(11,37,69,.35);
  --ok:#1B7A4B; --ok-bg:#D8F3DC; --warn:#7A5B00; --warn-bg:#FFF3D6; --err:#B3261E; --err-bg:rgba(179,38,30,.1);
  --serif:"Fraunces",Georgia,serif; --sans:"Manrope",-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh;padding:1rem 1rem 5rem;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
.demobar{display:flex;gap:.4rem;align-items:center;background:var(--ink);border-radius:8px;padding:.35rem .45rem;margin-bottom:.9rem}
.demobar span{color:var(--terracotta);font-family:var(--mono);font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;padding:0 .35rem}
.demobar a{flex:1;text-align:center;text-decoration:none;border-radius:6px;padding:.45rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--paper)}
.demobar a.on{font-weight:600;background:var(--paper);color:var(--ink)}
.proto-band{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:.35rem .5rem;border-radius:6px;margin-bottom:1rem}
header{padding-bottom:.8rem;border-bottom:1px solid var(--rule);margin-bottom:1rem}
.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terracotta);display:block}
h1{font-family:var(--serif);font-size:1.45rem;font-weight:380;line-height:1.15}
.sub{font-size:.82rem;color:var(--mute);margin-top:.15rem}
.count-strip{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:.2rem 0 .6rem}
.count-strip b{color:var(--terracotta)}

.row{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:.8rem .9rem;margin-bottom:.6rem;border-left:3px solid var(--rule-strong)}
.row.pending{border-left-color:var(--terracotta)}
.row.booked{border-left-color:var(--ok)}
.row.held{border-left-color:var(--warn)}
.rname{font-weight:600;font-size:.98rem}
.rmeta{font-family:var(--mono);font-size:.68rem;color:var(--mute);margin-top:.2rem}
.chip{float:right;font-family:var(--mono);font-size:.54rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:.18rem .45rem}
.c-booked{color:#fff;background:var(--ok)} .c-held{color:#5b4300;background:var(--warn-bg)}
.acts{display:flex;gap:.5rem;margin-top:.8rem}
.btn{flex:1;border-radius:9px;padding:.6rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;cursor:pointer;border:1px solid var(--rule-strong)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.no{background:#fff;color:var(--err);border-color:var(--err)}
.hint{font-size:.8rem;color:var(--mute);margin-top:.7rem;line-height:1.5}
.empty{color:var(--mute);font-style:italic;font-size:.9rem;padding:1.4rem .2rem;text-align:center}
.calbtn{display:inline-block;margin-top:.7rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--terracotta);cursor:pointer;border:1px solid var(--rule-strong);border-radius:7px;padding:.4rem .65rem;background:#fff}
.callinks{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.callinks a{flex:1;min-width:78px;text-align:center;text-decoration:none;font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);border:1px solid var(--rule-strong);border-radius:7px;padding:.45rem .3rem;background:#fff}

/* calendar */
.cal-day{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:.6rem .8rem;margin-bottom:.4rem;cursor:pointer}
.cal-day .d{font-size:.9rem}.cal-day .d small{display:block;font-family:var(--mono);font-size:.64rem;color:var(--mute)}
.cal-tag{font-family:var(--mono);font-size:.56rem;font-weight:700;text-transform:uppercase;border-radius:5px;padding:.2rem .5rem}
.t-free{color:var(--ok);background:var(--ok-bg)} .t-held{color:#5b4300;background:var(--warn-bg)} .t-booked{color:#fff;background:var(--ok)} .t-blocked{color:#fff;background:var(--mute)}
.cal-detail{background:#fff;border:1px solid var(--rule-strong);border-radius:9px;padding:.7rem .8rem;margin:-.2rem 0 .6rem}
.cal-detail .who{font-size:.88rem;margin-bottom:.5rem}
.cal-detail select,.cal-detail input{width:100%;border:1px solid var(--rule-strong);border-radius:8px;padding:.55rem .6rem;font-family:var(--sans);font-size:.92rem;background:#fff;color:var(--ink);margin-top:.4rem}
.sbtn{border:1px solid var(--rule-strong);background:#fff;color:var(--ink);border-radius:8px;padding:.45rem .8rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.sbtn.danger{color:var(--err);border-color:var(--err)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;padding:.7rem .3rem;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;border-top:3px solid transparent;position:relative}
.tabs button.on{color:var(--terracotta);border-top-color:var(--terracotta);font-weight:600}
.tabs .badge{position:absolute;top:.45rem;margin-left:.2rem;background:var(--terracotta);color:#fff;border-radius:20px;font-size:.5rem;padding:.05rem .3rem;font-weight:700}
.reset{display:block;text-align:center;font-family:var(--mono);font-size:.62rem;color:var(--mute);margin:1.2rem auto 0;cursor:pointer;text-decoration:underline;background:none;border:0}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;border-radius:999px;padding:.55rem 1.1rem;font-family:var(--mono);font-size:.72rem;z-index:60;display:none;max-width:92vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="demobar">
    <span>Demo</span>
    <a href="charter.html" class="on">Whole-boat charter</a>
    <a href="seat.html">Per-seat</a>
  </div>
  <div class="proto-band">Hosted plan · what your screen looks like · demo data</div>
  <header>
    <span class="eyebrow">Marlin Charters</span>
    <h1>Your bookings</h1>
    <div class="sub">Approve enquiries and see your calendar. We send the payment link, confirm the booking and email the customer — you just say yes.</div>
  </header>
  <div id="view"></div>
  <button class="reset" id="resetBtn">Reset demo data</button>
</div>

<div class="tabs">
  <button id="tab-appr" class="on">Approvals</button>
  <button id="tab-cal">Calendar</button>
  <button id="tab-up">Upcoming</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* Hosted demo — charter. Operator just approves; platform does the rest. */
var OP = { name:"Marlin Charters", boats:["Marlin","Stella"] };
var KEY = "hosted-demo-charter-v1";
function iso(d){return d.toISOString().slice(0,10);}
function off(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d);}
function fmt(s){var d=new Date(s+"T12:00:00");var t=iso(new Date());var l=d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});return s===t?"Today · "+l:l;}
function seed(){
  return { items:[
    {id:1,status:"pending",name:"Helena Ross (anniversary)",boat:"Marlin",exp:"Day charter",date:off(16),guests:18,phone:"+44 7700 900111"},
    {id:2,status:"pending",name:"Marco Bianchi",boat:"Stella",exp:"Sunset cruise",date:off(9),guests:12,phone:"+39 333 123 4567"},
    {id:3,status:"held",name:"O'Brien wedding party",boat:"Stella",exp:"Day charter",date:off(6),guests:20},
    {id:4,status:"booked",name:"Camilleri family",boat:"Marlin",exp:"Day charter",date:off(4),guests:14},
    {id:5,status:"booked",name:"Borg reunion",boat:"Marlin",exp:"Day charter",date:off(2),guests:24},
    {id:6,status:"booked",name:"Taylor group",boat:"Stella",exp:"Day charter",date:off(11),guests:22}
  ], blocks:[] };
}
function load(){try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&s.items)return s;}}catch(e){}return seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
var store=load();
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none";},2800);}

var tab="appr", calOpen=null;
function setTab(t){tab=t;["appr","cal","up"].forEach(function(k){document.getElementById("tab-"+k).className=(k===t?"on":"");});render();}
document.getElementById("tab-appr").onclick=function(){setTab("appr");};
document.getElementById("tab-cal").onclick=function(){setTab("cal");};
document.getElementById("tab-up").onclick=function(){setTab("up");};
document.getElementById("resetBtn").onclick=function(){try{localStorage.removeItem(KEY);}catch(e){}location.reload();};

function pending(){return store.items.filter(function(x){return x.status==="pending";});}

function renderApprovals(el){
  var ps=pending();
  if(!ps.length){el.innerHTML="<div class='empty'>Nothing waiting — you're all caught up. 🎉</div>";return;}
  el.innerHTML="<div class='count-strip'><b>"+ps.length+"</b> enquir"+(ps.length===1?"y":"ies")+" waiting for your yes/no</div>";
  ps.forEach(function(x){
    var r=document.createElement("div");r.className="row pending";
    r.innerHTML="<div class='rname'>"+x.name+"</div><div class='rmeta'>"+x.boat+" · "+x.exp+" · "+fmt(x.date)+" · "+x.guests+" guests · "+(x.phone||"")+"</div>"+
      "<div class='acts'><button class='btn ok'>Confirm</button><button class='btn no'>Decline</button></div>";
    r.querySelector(".ok").onclick=function(){x.status="held";save();toast("✓ Confirmed — payment link sent to the customer");render();};
    r.querySelector(".no").onclick=function(){x.status="declined";save();toast("Declined — customer notified");render();};
    el.appendChild(r);
  });
  var h=document.createElement("div");h.className="hint";h.textContent="When you Confirm, we email the customer a secure payment link. The moment they pay, the date locks and everyone gets a confirmation — automatically.";el.appendChild(h);
}

function blockOf(date){return store.blocks.find(function(b){return b.date===date;});}
function renderCalendar(el){
  el.innerHTML="<div class='count-strip'>Next 14 days · BookItMalta bookings lock the date automatically</div>";
  for(var i=0;i<14;i++){
    (function(date){
      var booked=store.items.find(function(x){return x.status==="booked"&&x.date===date;});
      var held=store.items.find(function(x){return x.status==="held"&&x.date===date;});
      var blk=blockOf(date);
      var tag=booked?"booked":(held?"held":(blk?"blocked":"free"));
      var who=booked?booked.name+" · "+booked.boat:(held?held.name+" · "+held.boat:(blk?"Blocked — "+blk.reason:"Open"));
      var row=document.createElement("div");row.className="cal-day";
      row.innerHTML="<div class='d'>"+fmt(date)+"<small>"+who+"</small></div><span class='cal-tag t-"+tag+"'>"+(tag==="booked"?"Booked":tag==="held"?"Held":tag==="blocked"?"Blocked":"Free")+"</span>";
      row.onclick=function(){calOpen=calOpen===date?null:date;render();};
      el.appendChild(row);
      if(calOpen===date){
        var d=document.createElement("div");d.className="cal-detail";
        if(booked){d.innerHTML="<div class='who'>"+booked.name+" — "+booked.boat+" · "+booked.guests+" guests. Paid &amp; locked.</div>";}
        else if(held){d.innerHTML="<div class='who'>"+held.name+" — awaiting payment. On hold.</div>";}
        else if(blk){
          d.innerHTML="<div class='who'>Blocked — "+blk.reason+"</div><button class='sbtn'>Unblock</button>";
          d.querySelector(".sbtn").onclick=function(e){e.stopPropagation();store.blocks=store.blocks.filter(function(b){return b.date!==date;});save();toast("Unblocked");render();};
        } else {
          d.innerHTML="<div class='who'>Mark this date unavailable — pick a reason:</div>"+
            "<select class='blk-reason'><option value=''>Choose a reason…</option><option>Maintenance</option><option>Personal / day off</option><option>Weather</option><option value='__other'>Other…</option></select>"+
            "<input class='blk-other' type='text' placeholder='Type a reason' style='display:none' />"+
            "<div style='margin-top:.55rem'><button class='sbtn danger blk-go'>Block this date</button></div>";
          var sel=d.querySelector(".blk-reason"), oth=d.querySelector(".blk-other");
          sel.onclick=function(e){e.stopPropagation();};
          sel.onchange=function(){oth.style.display=(sel.value==="__other")?"block":"none";};
          oth.onclick=function(e){e.stopPropagation();};
          d.querySelector(".blk-go").onclick=function(e){e.stopPropagation();
            var reason=(sel.value==="__other")?oth.value.trim():sel.value;
            if(!reason){toast("Pick a reason first");return;}
            store.blocks.push({date:date,reason:reason});save();toast("Date blocked — "+reason);render();
          };
        }
        el.appendChild(d);
      }
    })(off(i));
  }
  var note=document.createElement("div");note.className="hint";
  note.innerHTML="Blocking for maintenance, weather or a day off is included — every block is saved with a reason, so you (and we) can see why a date is closed.<br><br><b>Add-on:</b> taking your own off-platform paying bookings is a paid extra — it isn't one of the block reasons here.";
  el.appendChild(note);
}

function ymd(s){return s.replace(/-/g,"");}
function nextDay(s){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
function calLinks(title,date,details){
  var s=ymd(date), e=ymd(nextDay(date));
  var g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+s+"/"+e+"&details="+encodeURIComponent(details);
  var o="https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&subject="+encodeURIComponent(title)+"&startdt="+date+"&enddt="+nextDay(date)+"&allday=true&body="+encodeURIComponent(details);
  var ics="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//BookItMalta//demo//EN\nBEGIN:VEVENT\nUID:"+s+Math.random().toString(36).slice(2)+"@bookitmalta\nDTSTART;VALUE=DATE:"+s+"\nDTEND;VALUE=DATE:"+e+"\nSUMMARY:"+title+"\nDESCRIPTION:"+details+"\nEND:VEVENT\nEND:VCALENDAR";
  return { g:g, o:o, ics:"data:text/calendar;charset=utf-8,"+encodeURIComponent(ics) };
}
function renderUpcoming(el){
  var ups=store.items.filter(function(x){return x.status==="booked"||x.status==="held";}).sort(function(a,b){return a.date<b.date?-1:1;});
  if(!ups.length){el.innerHTML="<div class='empty'>No upcoming bookings yet.</div>";return;}
  el.innerHTML="<div class='count-strip'><b>"+ups.length+"</b> upcoming</div>";
  ups.forEach(function(x){
    var r=document.createElement("div");r.className="row "+(x.status==="booked"?"booked":"held");
    var title="Marlin Charters — "+x.exp+" ("+x.name+")";
    var L=calLinks(title, x.date, x.guests+" guests · "+x.boat+" · via BookItMalta");
    r.innerHTML="<span class='chip c-"+(x.status==="booked"?"booked":"held")+"'>"+(x.status==="booked"?"Booked":"Held")+"</span>"+
      "<div class='rname'>"+x.name+"</div><div class='rmeta'>"+x.boat+" · "+x.exp+" · "+fmt(x.date)+" · "+x.guests+" guests</div>"+
      "<span class='calbtn'>＋ Add to calendar</span>"+
      "<div class='callinks' style='display:none'><a href='"+L.g+"' target='_blank' rel='noopener'>Google</a><a href='"+L.ics+"' download='booking.ics'>Apple</a><a href='"+L.o+"' target='_blank' rel='noopener'>Outlook</a></div>";
    r.querySelector(".calbtn").onclick=function(){var c=r.querySelector(".callinks");c.style.display=(c.style.display==="none")?"flex":"none";};
    el.appendChild(r);
  });
}

function render(){
  // approvals badge
  var n=pending().length;
  var t=document.getElementById("tab-appr");
  t.innerHTML="Approvals"+(n?" <span class='badge'>"+n+"</span>":"");
  var el=document.getElementById("view");
  if(tab==="appr")renderApprovals(el);
  else if(tab==="cal")renderCalendar(el);
  else renderUpcoming(el);
}
render();
</script>
</body>
</html>
