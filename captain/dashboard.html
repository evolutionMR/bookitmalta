<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Captain dashboard — BookItMalta</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..800&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#0B2545; --ink-soft:#1C3558; --paper:#F4EBD9; --paper-deep:#EBDFC6; --card:#FFFAF1;
  --terracotta:#C85C2E; --mute:rgba(11,37,69,.55); --rule:rgba(11,37,69,.15); --rule-strong:rgba(11,37,69,.35);
  --ok:#1B7A4B; --ok-bg:#D8F3DC; --warn:#7A5B00; --warn-bg:#FFF3D6; --err:#B3261E; --err-bg:rgba(179,38,30,.1);
  --serif:"Fraunces",Georgia,serif; --sans:"Manrope",-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh;padding:1rem 1rem 5.5rem;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;padding-bottom:.8rem;border-bottom:1px solid var(--rule);margin-bottom:1rem}
.eyebrow{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terracotta);display:block}
h1{font-family:var(--serif);font-size:1.4rem;font-weight:380;line-height:1.15}
.who{font-family:var(--mono);font-size:.66rem;color:var(--mute);margin-top:.15rem;word-break:break-all}
.signout{flex:0 0 auto;background:#fff;border:1px solid var(--rule-strong);border-radius:999px;padding:.45rem .8rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.count-strip{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:.2rem 0 .7rem}
.count-strip b{color:var(--terracotta)}
.row{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:.8rem .9rem;margin-bottom:.6rem;border-left:3px solid var(--rule-strong)}
.row.pending{border-left-color:var(--terracotta)} .row.booked{border-left-color:var(--ok)} .row.held{border-left-color:var(--warn)}
.rname{font-weight:600;font-size:.98rem}
.rmeta{font-family:var(--mono);font-size:.68rem;color:var(--mute);margin-top:.2rem}
.chip{float:right;font-family:var(--mono);font-size:.54rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:.18rem .45rem}
.c-booked{color:#fff;background:var(--ok)} .c-held{color:#5b4300;background:var(--warn-bg)}
.contact{font-family:var(--mono);font-size:.66rem;color:var(--ink-soft);margin-top:.45rem}
.acts{display:flex;gap:.5rem;margin-top:.8rem}
.btn{flex:1;border-radius:9px;padding:.65rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;cursor:pointer;border:1px solid var(--rule-strong)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)} .btn.no{background:#fff;color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.5}
.hint{font-size:.8rem;color:var(--mute);margin-top:.7rem;line-height:1.5}
.empty{color:var(--mute);font-style:italic;font-size:.9rem;padding:1.6rem .2rem;text-align:center}
.spin{text-align:center;color:var(--mute);font-family:var(--mono);font-size:.78rem;padding:2rem 0;text-transform:uppercase;letter-spacing:.06em}
.errbar{background:var(--err-bg);color:var(--err);border:1px solid var(--err);border-radius:9px;padding:.7rem .9rem;font-size:.88rem;margin-bottom:.7rem}
.cal-day{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:.6rem .8rem;margin-bottom:.4rem}
.cal-day .d{font-size:.9rem}.cal-day .d small{display:block;font-family:var(--mono);font-size:.64rem;color:var(--mute)}
.cal-tag{font-family:var(--mono);font-size:.56rem;font-weight:700;text-transform:uppercase;border-radius:5px;padding:.2rem .5rem}
.t-free{color:var(--ok);background:var(--ok-bg)} .t-held{color:#5b4300;background:var(--warn-bg)} .t-booked{color:#fff;background:var(--ok)}
.calbtn{display:inline-block;margin-top:.7rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--terracotta);cursor:pointer;border:1px solid var(--rule-strong);border-radius:7px;padding:.4rem .65rem;background:#fff}
.callinks{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.callinks a{flex:1;min-width:78px;text-align:center;text-decoration:none;font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);border:1px solid var(--rule-strong);border-radius:7px;padding:.45rem .3rem;background:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;padding:.75rem .3rem;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;border-top:3px solid transparent;position:relative}
.tabs button.on{color:var(--terracotta);border-top-color:var(--terracotta);font-weight:600}
.tabs .badge{position:absolute;top:.5rem;margin-left:.2rem;background:var(--terracotta);color:#fff;border-radius:20px;font-size:.5rem;padding:.05rem .3rem;font-weight:700}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;border-radius:999px;padding:.55rem 1.1rem;font-family:var(--mono);font-size:.72rem;z-index:60;display:none;max-width:92vw;text-align:center}
.toast.err{background:var(--err)}
.lrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--rule-strong);border-radius:11px;padding:.85rem .9rem;margin-bottom:.55rem;cursor:pointer}
.lrow.pending{border-left-color:var(--terracotta)}
.lrow:active{background:#fff}
.lrow-main{flex:1;min-width:0}
.chev{font-style:normal;font-size:1.5rem;color:var(--mute);line-height:1;flex:0 0 auto}
.backlink{display:inline-flex;align-items:center;gap:.2rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--terracotta);margin-bottom:1rem;cursor:pointer;text-decoration:none}
.d-eyebrow{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terracotta)}
.d-name{font-family:var(--serif);font-size:1.5rem;font-weight:380;margin:.15rem 0 .5rem;color:var(--ink);line-height:1.15}
.d-pill{display:inline-block;font-family:var(--mono);font-size:.56rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5b4300;background:var(--warn-bg);border-radius:6px;padding:.25rem .55rem;margin-bottom:1.1rem}
.d-block{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:.2rem .9rem;margin-bottom:.7rem}
.d-row{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--rule);font-size:.92rem}
.d-row:last-child{border-bottom:none}
.d-row span{font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);flex:0 0 auto}
.d-row b{font-weight:600;color:var(--ink);text-align:right;word-break:break-word}
.d-contact{display:block;padding:.6rem 0;font-family:var(--mono);font-size:.82rem;color:#185FA5;text-decoration:none;border-bottom:1px solid var(--rule);word-break:break-all}
.d-contact:last-child{border-bottom:none}
.d-quote{font-style:italic;color:var(--ink-soft);line-height:1.55;padding:.2rem .1rem 0;margin-bottom:.4rem}
.d-actions{display:flex;flex-direction:column;gap:.6rem;margin-top:1.1rem}
.d-actions .btn{flex:0 0 auto;padding:.95rem;font-size:.72rem}
.btn.ghost{background:#fff;color:var(--ink-soft);border-color:var(--rule-strong)}
.row.archived{border-left-color:var(--rule-strong);opacity:.82}
.archbtn{color:var(--mute)}
.tidybar{display:flex;justify-content:space-between;align-items:center;gap:.6rem;background:var(--warn-bg);border:1px solid var(--rule);border-radius:9px;padding:.55rem .4rem .55rem .75rem;margin-bottom:.7rem;font-size:.82rem;color:#5b4300}
.tidybar button{flex:0 0 auto;padding:.4rem .7rem;font-size:.6rem;background:#fff}
.archwrap{position:fixed;inset:0;background:rgba(11,37,69,.45);display:none;align-items:flex-end;justify-content:center;z-index:80}
.archcard{background:var(--card);border-radius:14px 14px 0 0;max-width:600px;width:100%;padding:1.2rem 1.1rem calc(1.6rem + env(safe-area-inset-bottom))}
.archtitle{font-family:var(--serif);font-size:1.25rem;font-weight:380}
.archlabel{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:.3rem}
.archselect,.archinput{width:100%;padding:.7rem;border:1px solid var(--rule-strong);border-radius:8px;background:#fff;font-family:var(--sans);font-size:.95rem;color:var(--ink)}
.archinput{display:none;margin-top:.5rem}
.archacts{display:flex;gap:.5rem;margin-top:1rem}
.archacts .btn{padding:.85rem;font-size:.7rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <span class="eyebrow">Captain dashboard</span>
      <h1 id="opName">Loading…</h1>
      <div class="who">Signed in as <span id="opEmail">—</span></div>
    </div>
    <button class="signout" id="signout">Sign out</button>
  </header>
  <div id="view"><div class="spin">Loading your bookings…</div></div>
</div>

<div class="tabs">
  <button id="tab-appr" class="on">Approvals</button>
  <button id="tab-cal">Calendar</button>
  <button id="tab-up">Upcoming</button>
  <button id="tab-arch">Archived</button>
</div>
<div class="toast" id="toast"></div>

<div class="archwrap" id="archModal">
  <div class="archcard">
    <div class="archtitle">Archive this item</div>
    <div class="hint" style="margin:.1rem 0 .9rem">It leaves your active tabs but stays in Archived — you can restore it anytime.</div>
    <label class="archlabel" for="archReason">Reason</label>
    <select id="archReason" class="archselect">
      <option value="Past date">Past date</option>
      <option value="No-show / didn't pay">No-show / didn't pay</option>
      <option value="Duplicate">Duplicate</option>
      <option value="Test data">Test data</option>
      <option value="Other">Other</option>
    </select>
    <input id="archOther" class="archinput" placeholder="Add a note (optional)" />
    <div class="archacts">
      <button class="btn" id="archCancel" style="background:#fff">Cancel</button>
      <button class="btn" id="archGo" style="background:var(--terracotta);color:#fff;border-color:var(--terracotta)">Archive</button>
    </div>
  </div>
</div>

<script>
var DATA=null, tab="appr", loading=true, errMsg=null;
var currentDetail=null, detailOpen=false, pendingReload=false;

function toast(m,err){var t=document.getElementById("toast");t.textContent=m;t.className="toast"+(err?" err":"");t.style.display="block";setTimeout(function(){t.style.display="none";},2800);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function iso(d){return d.toISOString().slice(0,10);}
function offDay(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d);}
function fmt(s){if(!s)return"";var d=new Date(s+"T12:00:00");var t=iso(new Date());var l=d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});return s===t?"Today · "+l:l;}
function slot(x){if(!(DATA&&DATA.model==="per_seat"))return "";var s=x&&(x.slot_time||x.tour_option);return s?(" · "+s):"";}
function gunit(){return (DATA&&DATA.model==="per_seat")?"seats":"guests";}

function ymd(s){return s.replace(/-/g,"");}
function nextDay(s){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+1);return iso(d);}
function calLinks(title,date,details){
  var s=ymd(date),e=ymd(nextDay(date));
  var g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+s+"/"+e+"&details="+encodeURIComponent(details);
  var o="https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&subject="+encodeURIComponent(title)+"&startdt="+date+"&enddt="+nextDay(date)+"&allday=true&body="+encodeURIComponent(details);
  var ics="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//BookItMalta//captain//EN\nBEGIN:VEVENT\nUID:"+s+Math.random().toString(36).slice(2)+"@bookitmalta\nDTSTART;VALUE=DATE:"+s+"\nDTEND;VALUE=DATE:"+e+"\nSUMMARY:"+title+"\nDESCRIPTION:"+details+"\nEND:VEVENT\nEND:VCALENDAR";
  return {g:g,o:o,ics:"data:text/calendar;charset=utf-8,"+encodeURIComponent(ics)};
}

function setTab(t){tab=t;["appr","cal","up","arch"].forEach(function(k){document.getElementById("tab-"+k).className=(k===t?"on":"");});render();}
document.getElementById("tab-appr").onclick=function(){setTab("appr");};
document.getElementById("tab-cal").onclick=function(){setTab("cal");};
document.getElementById("tab-up").onclick=function(){setTab("up");};
document.getElementById("tab-arch").onclick=function(){setTab("arch");};
document.getElementById("signout").onclick=async function(){try{await fetch("/api/captain?mode=logout",{method:"POST",credentials:"include"});}catch(e){}window.location.href="/captain/login";};

async function load(){
  loading=true;errMsg=null;render();
  try{
    var res=await fetch("/api/captain?mode=ops-data",{credentials:"include"});
    if(res.status===401){window.location.href="/captain/login?error=expired";return;}
    var j=await res.json();
    if(!res.ok||!j.ok){errMsg=(j&&j.error)||"Could not load your bookings.";loading=false;render();return;}
    DATA=j;loading=false;
    document.getElementById("opName").textContent=j.name||"Dashboard";
    document.getElementById("opEmail").textContent=j.email||"—";
    render();
  }catch(e){errMsg="Network error — tap retry below.";loading=false;render();}
}

function badge(){var n=DATA?DATA.pending.length:0;document.getElementById("tab-appr").innerHTML="Approvals"+(n?" <span class='badge'>"+n+"</span>":"");}

function renderApprovals(el){
  var ps=DATA.pending;
  if(!ps.length){el.innerHTML="<div class='empty'>Nothing waiting — you're all caught up.</div>";return;}
  el.innerHTML="<div class='count-strip'><b>"+ps.length+"</b> enquir"+(ps.length===1?"y":"ies")+" waiting — tap to review</div>";
  ps.forEach(function(x){
    var r=document.createElement("div");r.className="lrow pending";
    r.innerHTML="<div class='lrow-main'><div class='rname'>"+esc(x.customer_name||"Enquiry")+"</div>"+
      "<div class='rmeta'>"+fmt(x.preferred_date)+slot(x)+" · "+(x.party_size||1)+" "+gunit()+"</div></div>"+
      "<span class='chev'>›</span>";
    r.onclick=function(){openDetail(x);};
    el.appendChild(r);
  });
}

// ---- enquiry detail screen (V1) with real back-button support ----
function openDetail(x){
  currentDetail=x; detailOpen=true;
  history.pushState({detailOpen:true},"");
  paintDetail(x);
}
function paintDetail(x){
  document.querySelector(".tabs").style.display="none";
  var el=document.getElementById("view");
  var glabel=(DATA&&DATA.model==="per_seat")?"Seats":"Guests";
  var rows=
    "<div class='d-row'><span>Date</span><b>"+fmt(x.preferred_date)+"</b></div>"+
    ((DATA&&DATA.model==="per_seat"&&x.slot_time)?"<div class='d-row'><span>Departure</span><b>"+esc(x.slot_time)+"</b></div>":"")+
    ((DATA&&DATA.model==="per_seat"&&x.tour_option&&!x.slot_time)?"<div class='d-row'><span>Option</span><b>"+esc(x.tour_option)+"</b></div>":"")+
    "<div class='d-row'><span>"+glabel+"</span><b>"+(x.party_size||1)+"</b></div>"+
    (x.alt_dates?"<div class='d-row'><span>Alt dates</span><b>"+esc(x.alt_dates)+"</b></div>":"")+
    (x.created_at?"<div class='d-row'><span>Received</span><b>"+fmt(String(x.created_at).slice(0,10))+"</b></div>":"");
  var contact=
    (x.customer_email?"<a class='d-contact' href='mailto:"+esc(x.customer_email)+"'>"+esc(x.customer_email)+"</a>":"")+
    (x.customer_phone?"<a class='d-contact' href='tel:"+esc(x.customer_phone)+"'>"+esc(x.customer_phone)+"</a>":"");
  el.innerHTML=
    "<a class='backlink' id='backLink'>‹ Approvals</a>"+
    "<div class='d-eyebrow'>Enquiry</div>"+
    "<div class='d-name'>"+esc(x.customer_name||"Enquiry")+"</div>"+
    "<div class='d-pill'>Awaiting your decision</div>"+
    "<div class='d-block'>"+rows+"</div>"+
    (contact?"<div class='d-block'>"+contact+"</div>":"")+
    (x.message?"<div class='d-quote'>“"+esc(x.message)+"”</div>":"")+
    "<div class='d-actions'>"+
      "<button class='btn ok' id='dOk'>Confirm &amp; send payment link</button>"+
      "<button class='btn no' id='dNo'>Decline</button>"+
      "<button class='btn ghost' id='dArch'>Archive</button>"+
    "</div>"+
    "<div class='hint'>Confirm sends the customer a secure payment link automatically. The booking locks the moment they pay. Archive just clears it from your list — no email to the customer.</div>";
  document.getElementById("backLink").onclick=function(){history.back();};
  var ok=document.getElementById("dOk"),no=document.getElementById("dNo");
  ok.onclick=function(){act(x.id,"confirm",[ok,no]);};
  no.onclick=function(){if(confirm("Decline this enquiry? The customer will be told the date isn't available."))act(x.id,"decline",[ok,no]);};
  document.getElementById("dArch").onclick=function(){askArchive(x.id,"enquiry");};
  window.scrollTo(0,0);
}
window.addEventListener("popstate",function(){
  if(detailOpen){ detailOpen=false; currentDetail=null; document.querySelector(".tabs").style.display="flex"; }
  if(pendingReload){ pendingReload=false; load(); } else { render(); }
});

async function act(id,action,btns){
  btns.forEach(function(b){b.disabled=true;});
  try{
    var res=await fetch("/api/captain?mode=enquiry-action",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({id:id,action:action})});
    var j={};try{j=await res.json();}catch(e){}
    if(res.ok&&j.ok){
      toast(action==="confirm"?"✓ Confirmed — payment link sent":"Declined — customer notified");
      pendingReload=true;
      if(detailOpen && history.state && history.state.detailOpen){ history.back(); }
      else { detailOpen=false; currentDetail=null; document.querySelector(".tabs").style.display="flex"; pendingReload=false; load(); }
    } else {
      toast((j&&j.error)||"Something went wrong",true);
      btns.forEach(function(b){b.disabled=false;});
    }
  }catch(e){toast("Network error",true);btns.forEach(function(b){b.disabled=false;});}
}

function renderCalendar(el){
  if(DATA.model==="per_seat")return renderCalendarSeats(el);
  el.innerHTML="<div class='count-strip'>Next 14 days · paid bookings lock the date automatically</div>";
  for(var i=0;i<14;i++){
    var date=offDay(i);
    var b=DATA.booked.find(function(x){return x.charter_date===date;});
    var hld=DATA.awaiting.find(function(x){return x.preferred_date===date;});
    var tag=b?"booked":(hld?"held":"free");
    var who=b?esc(b.customer_name)+slot(b):(hld?esc(hld.customer_name)+" (awaiting payment)":"Open");
    var row=document.createElement("div");row.className="cal-day";
    row.innerHTML="<div class='d'>"+fmt(date)+"<small>"+who+"</small></div><span class='cal-tag t-"+tag+"'>"+(tag==="booked"?"Booked":tag==="held"?"Held":"Free")+"</span>";
    el.appendChild(row);
  }
  var note=document.createElement("div");note.className="hint";note.textContent="Your calendar fills from BookItMalta bookings — a paid booking locks the date so you can't be double-booked.";el.appendChild(note);
}

function renderCalendarSeats(el){
  el.innerHTML="<div class='count-strip'>Next 14 days · seats sold per departure</div>";
  var slots=(DATA.slots&&DATA.slots.length)?DATA.slots:["—"];
  for(var i=0;i<14;i++){
    var date=offDay(i);
    var card=document.createElement("div");card.className="cal-day";card.style.display="block";
    var html="<div class='d' style='margin-bottom:.3rem'>"+fmt(date)+"</div>";
    slots.forEach(function(s){
      var sold=DATA.booked.filter(function(b){return b.charter_date===date&&((b.slot_time||b.tour_option)===s);}).reduce(function(a,b){return a+(b.party_size||0);},0);
      var ov=(DATA.capOverrides||[]).find(function(o){return o.charter_date===date&&o.slot_time===s;});
      var cap=ov?ov.max_seats:DATA.defaultCap;
      var tag=sold===0?"t-free":((cap&&sold>=cap)?"t-booked":"t-held");
      var label=sold+(cap?(" / "+cap):"")+" seats";
      html+="<div style='display:flex;justify-content:space-between;align-items:center;padding:.32rem 0'><small style='font-family:var(--mono);font-size:.74rem;color:var(--ink-soft)'>"+esc(s)+"</small><span class='cal-tag "+tag+"'>"+label+"</span></div>";
    });
    card.innerHTML=html;
    el.appendChild(card);
  }
  var note=document.createElement("div");note.className="hint";note.textContent="Each departure fills independently. Seats sold come from paid BookItMalta bookings; capacity follows your default or any cap override.";el.appendChild(note);
}

function renderUpcoming(el){
  var rows=[];
  var ps=(DATA&&DATA.model==="per_seat");
  DATA.booked.forEach(function(x){rows.push({status:"booked",id:x.id,kind:"booking",name:x.customer_name,date:x.charter_date,party:x.party_size,slot:(ps?(x.slot_time||x.tour_option):null),email:x.customer_email,phone:x.customer_phone});});
  DATA.awaiting.forEach(function(x){rows.push({status:"held",id:x.id,kind:"enquiry",name:x.customer_name,date:x.preferred_date,party:x.party_size,slot:(ps?(x.slot_time||x.tour_option):null),email:x.customer_email});});
  rows.sort(function(a,b){return (a.date||"")<(b.date||"")?-1:1;});
  if(!rows.length){el.innerHTML="<div class='empty'>No upcoming bookings yet.</div>";return;}
  el.innerHTML="<div class='count-strip'><b>"+rows.length+"</b> upcoming</div>";
  rows.forEach(function(x){
    var r=document.createElement("div");r.className="row "+(x.status==="booked"?"booked":"held");
    var title=(DATA.name||"Charter")+" — "+fmt(x.date)+(x.slot?(" "+x.slot):"");
    var L=calLinks(title,x.date,(x.party||1)+" guests · via BookItMalta");
    r.innerHTML="<span class='chip c-"+(x.status==="booked"?"booked":"held")+"'>"+(x.status==="booked"?"Booked":"Held")+"</span>"+
      "<div class='rname'>"+esc(x.name||"Booking")+"</div>"+
      "<div class='rmeta'>"+fmt(x.date)+(x.slot?(" · "+esc(x.slot)):"")+" · "+(x.party||1)+" "+gunit()+"</div>"+
      (x.email?"<div class='contact'>"+esc(x.email)+(x.phone?(" · "+esc(x.phone)):"")+"</div>":"")+
      "<span class='calbtn'>＋ Add to calendar</span>"+
      "<span class='calbtn archbtn' style='margin-left:.4rem'>Archive</span>"+
      "<div class='callinks' style='display:none'><a href='"+L.g+"' target='_blank' rel='noopener'>Google</a><a href='"+L.ics+"' download='booking.ics'>Apple</a><a href='"+L.o+"' target='_blank' rel='noopener'>Outlook</a></div>";
    r.querySelector(".calbtn").onclick=function(){var c=r.querySelector(".callinks");c.style.display=(c.style.display==="none")?"flex":"none";};
    r.querySelector(".archbtn").onclick=function(){askArchive(x.id,x.kind);};
    el.appendChild(r);
  });
}

function render(){
  var el=document.getElementById("view");
  if(loading){el.innerHTML="<div class='spin'>Loading your bookings…</div>";return;}
  if(errMsg){el.innerHTML="<div class='errbar'>"+esc(errMsg)+"</div><div class='spin' id='retry' style='cursor:pointer'>Tap to retry</div>";var rt=document.getElementById("retry");if(rt)rt.onclick=load;return;}
  badge();
  if(tab==="appr"){renderApprovals(el);tidyBar(el);}
  else if(tab==="cal")renderCalendar(el);
  else if(tab==="arch")renderArchived(el);
  else {renderUpcoming(el);tidyBar(el);}
}

// ---- archive (soft, never delete) ----
var pendingArchive=null;
function isTest(name,email){var s=((name||"")+" "+(email||"")).toLowerCase();return /(\btest\b|smoke|e2e|probe|delete me|dummy)/.test(s)||/\+[^@]*@/.test(email||"")||/@example\./.test(email||"");}
function collectTestLooking(){
  var out=[];if(!DATA)return out;
  (DATA.pending||[]).forEach(function(x){if(isTest(x.customer_name,x.customer_email))out.push({id:x.id,kind:"enquiry"});});
  (DATA.awaiting||[]).forEach(function(x){if(isTest(x.customer_name,x.customer_email))out.push({id:x.id,kind:"enquiry"});});
  (DATA.booked||[]).forEach(function(x){if(isTest(x.customer_name,x.customer_email))out.push({id:x.id,kind:"booking"});});
  return out;
}
function tidyBar(el){
  var t=collectTestLooking();if(!t.length)return;
  var bar=document.createElement("div");bar.className="tidybar";
  bar.innerHTML="<span>"+t.length+" test-looking item"+(t.length>1?"s":"")+" here</span><button class='btn'>Archive all</button>";
  bar.querySelector("button").onclick=function(){
    if(confirm("Archive "+t.length+" test-looking item"+(t.length>1?"s":"")+"? You can restore them from the Archived tab."))archiveMany(t);
  };
  el.insertBefore(bar,el.firstChild);
}
function askArchive(id,kind){
  pendingArchive={id:id,kind:kind};
  document.getElementById("archReason").value="Past date";
  var o=document.getElementById("archOther");o.value="";o.style.display="none";
  document.getElementById("archModal").style.display="flex";
}
function hideArch(){document.getElementById("archModal").style.display="none";pendingArchive=null;}
document.getElementById("archReason").onchange=function(){document.getElementById("archOther").style.display=(this.value==="Other")?"block":"none";};
document.getElementById("archCancel").onclick=hideArch;
document.getElementById("archModal").onclick=function(e){if(e.target===this)hideArch();};
document.getElementById("archGo").onclick=function(){
  if(!pendingArchive)return;
  var sel=document.getElementById("archReason").value;
  var reason=(sel==="Other")?(document.getElementById("archOther").value.trim()||"Other"):sel;
  var p=pendingArchive;hideArch();doArchive(p.id,p.kind,reason);
};
async function doArchive(id,kind,reason){
  try{
    var res=await fetch("/api/captain?mode=archive-action",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({id:id,kind:kind,action:"archive",reason:reason})});
    var j={};try{j=await res.json();}catch(e){}
    if(res.ok&&j.ok){toast("Archived — see the Archived tab");finishMutation();}
    else toast((j&&j.error)||"Could not archive",true);
  }catch(e){toast("Network error",true);}
}
async function doUnarchive(id,kind){
  try{
    var res=await fetch("/api/captain?mode=archive-action",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({id:id,kind:kind,action:"unarchive"})});
    var j={};try{j=await res.json();}catch(e){}
    if(res.ok&&j.ok){toast("Restored");load();}
    else toast((j&&j.error)||"Could not restore",true);
  }catch(e){toast("Network error",true);}
}
async function archiveMany(list){
  var okc=0;
  for(var i=0;i<list.length;i++){
    try{var res=await fetch("/api/captain?mode=archive-action",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({id:list[i].id,kind:list[i].kind,action:"archive",reason:"Test data"})});if(res.ok)okc++;}catch(e){}
  }
  toast("Archived "+okc+" item"+(okc===1?"":"s"));load();
}
function finishMutation(){
  if(detailOpen && history.state && history.state.detailOpen){pendingReload=true;history.back();}
  else{detailOpen=false;currentDetail=null;document.querySelector(".tabs").style.display="flex";load();}
}
function renderArchived(el){
  var xs=(DATA&&DATA.archived)||[];
  if(!xs.length){el.innerHTML="<div class='empty'>Nothing archived. Items you archive land here — restore any of them with one tap.</div>";return;}
  el.innerHTML="<div class='count-strip'><b>"+xs.length+"</b> archived · kept for your records</div>";
  xs.forEach(function(x){
    var r=document.createElement("div");r.className="row archived";
    r.innerHTML="<div class='rname' style='color:var(--ink-soft)'>"+esc(x.name||"Item")+"</div>"+
      "<div class='rmeta'>"+fmt(x.date)+(x.slot?(" · "+esc(x.slot)):"")+" · "+(x.party||1)+" "+gunit()+(x.reason?(" · "+esc(x.reason)):"")+"</div>"+
      "<div class='acts'><button class='btn ghost' style='flex:0 0 auto;padding:.5rem .9rem'>Restore</button></div>";
    r.querySelector("button").onclick=function(){doUnarchive(x.id,x.kind);};
    el.appendChild(r);
  });
}

load();
</script>
</body>
</html>
