<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />

<title>Captain dashboard — BookItMalta</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..800&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --ink: #0B2545;
  --ink-soft: #1C3558;
  --paper: #F4EBD9;
  --paper-deep: #EBDFC6;
  --terracotta: #C85C2E;
  --mute: rgba(11, 37, 69, 0.55);
  --rule: rgba(11, 37, 69, 0.15);
  --rule-strong: rgba(11, 37, 69, 0.35);
  --ok: #1B4332;
  --ok-bg: #D8F3DC;
  --warn-bg: #FFF3D6;
  --warn: #7A5B00;
  --err: #B3261E;
  --err-bg: rgba(179, 38, 30, 0.08);
  --serif: "Fraunces", Georgia, serif;
  --sans:  "Manrope", -apple-system, sans-serif;
  --mono:  "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  padding: 1rem 1rem 4rem;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(11,37,69,0.035) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: 0;
}
.wrap { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }

/* ---- Header ---- */
header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 1.4rem;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--terracotta);
  display: block;
  margin-bottom: 0.15rem;
}
h1 {
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 380;
  letter-spacing: -0.015em;
  line-height: 1.15;
  margin-bottom: 0.2rem;
}
.signed-in {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--mute);
  letter-spacing: 0.04em;
}
.signed-in strong { color: var(--ink); font-weight: 600; }
.logout-btn {
  background: white;
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  padding: 0.45rem 0.9rem;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
}
.logout-btn:hover { background: var(--ink); color: var(--paper); }

/* ---- Summary strip ---- */
.summary-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.6rem;
  margin-bottom: 1.4rem;
}
.summary-tile {
  background: #FFFAF1;
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 0.75rem 0.7rem;
  text-align: left;
}
.summary-tile .label {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mute);
  display: block;
  margin-bottom: 0.2rem;
}
.summary-tile .value {
  font-family: var(--serif);
  font-size: 1.3rem;
  font-weight: 420;
  color: var(--ink);
  line-height: 1;
}
.summary-tile .value.zero { color: var(--mute); font-weight: 380; }

/* ---- Day cards ---- */
.day-card {
  background: #FFFAF1;
  border: 1px solid var(--rule);
  border-radius: 10px;
  margin-bottom: 0.9rem;
  overflow: hidden;
}
.day-card.is-today { border-color: var(--terracotta); box-shadow: 0 6px 24px rgba(200, 92, 46, 0.12); }
.day-card.is-empty { opacity: 0.7; }

.day-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0.8rem 1rem 0.6rem;
  border-bottom: 1px solid var(--rule);
  gap: 0.6rem;
}
.day-date {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-weight: 420;
  color: var(--ink);
}
.day-date .dow {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mute);
  margin-right: 0.4rem;
}
.is-today .day-date .dow { color: var(--terracotta); }
.day-meta {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.06em;
  color: var(--mute);
  text-transform: uppercase;
  text-align: right;
}
.day-meta strong { color: var(--ink); font-weight: 600; }

/* ---- Slot row ---- */
.slot-list { padding: 0.2rem 0; }
.slot {
  padding: 0.65rem 1rem 0.85rem;
  border-bottom: 1px dashed var(--rule);
}
.slot:last-child { border-bottom: none; }
.slot-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  margin-bottom: 0.45rem;
}
.slot-time {
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.04em;
}
.slot-count {
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.04em;
}
.slot-count.ok      { color: var(--ink-soft); }
.slot-count.warn    { color: var(--warn); }
.slot-count.full    { color: var(--err); font-weight: 600; }
.slot-count.blocked { color: var(--err); font-weight: 600; }

.slot-blocked-tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--err-bg);
  color: var(--err);
  padding: 0.25rem 0.55rem;
  border-radius: 999px;
  border: 1px solid rgba(179, 38, 30, 0.25);
  margin-top: 0.3rem;
}

.manifest {
  list-style: none;
  display: grid;
  gap: 0.35rem;
  margin-top: 0.4rem;
}
.manifest li {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.5rem;
  font-size: 0.88rem;
  color: var(--ink);
  padding: 0.3rem 0.55rem;
  background: var(--paper);
  border-radius: 6px;
  border: 1px solid var(--rule);
}
.manifest .name {
  font-weight: 500;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.manifest .party {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--mute);
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.manifest .contact {
  font-family: var(--mono);
  font-size: 0.66rem;
  color: var(--mute);
  letter-spacing: 0.03em;
}
.manifest details { width: 100%; }
.manifest summary {
  display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem;
  cursor: pointer; list-style: none;
}
.manifest summary::-webkit-details-marker { display: none; }
.manifest details[open] .contact { display: block; margin-top: 0.25rem; }

.empty-note {
  padding: 0.7rem 1rem 0.9rem;
  color: var(--mute);
  font-size: 0.88rem;
  font-style: italic;
}

/* ---- Loading / error states ---- */
.spinner {
  text-align: center;
  padding: 2rem 1rem;
  color: var(--mute);
  font-family: var(--mono);
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.error-banner {
  background: var(--err-bg);
  color: var(--err);
  border: 1px solid rgba(179, 38, 30, 0.25);
  border-radius: 8px;
  padding: 0.8rem 1rem;
  margin-bottom: 1rem;
  font-size: 0.88rem;
}
.refresh-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  background: white;
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  padding: 0.45rem 0.9rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  margin-left: 0.5rem;
}
.refresh-btn:hover { background: var(--ink); color: var(--paper); }

footer.dash-footer {
  text-align: center;
  padding-top: 1.5rem;
  margin-top: 1rem;
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mute);
}

@media (max-width: 480px) {
  .summary-row { grid-template-columns: 1fr 1fr 1fr; gap: 0.4rem; }
  .summary-tile .value { font-size: 1.1rem; }
  h1 { font-size: 1.3rem; }
}
</style>
</head>

<body>
<div class="wrap">

<header>
  <div>
    <span class="eyebrow">Captain dashboard</span>
    <h1 id="tenantName">Loading…</h1>
    <span class="signed-in">Signed in as <strong id="userEmail">—</strong></span>
  </div>
  <button class="logout-btn" id="logoutBtn">Sign out</button>
</header>

<div id="topNotice"></div>

<div class="summary-row" id="summary" hidden>
  <div class="summary-tile">
    <span class="label">Today</span>
    <span class="value" id="sumToday">0</span>
  </div>
  <div class="summary-tile">
    <span class="label">Next 14d bookings</span>
    <span class="value" id="sumBookings">0</span>
  </div>
  <div class="summary-tile">
    <span class="label">Seats sold</span>
    <span class="value" id="sumSeats">0</span>
  </div>
</div>

<div id="dashContent">
  <div class="spinner">Loading next 14 days…</div>
</div>

<footer class="dash-footer">
  BookItMalta · captain v0.3
  <button class="refresh-btn" id="refreshBtn">Refresh</button>
</footer>

</div>

<script>
// =============================================================================
// /captain/dashboard — B2.3 read-only operations view
// =============================================================================
// Fetches /api/captain?mode=dashboard-data (HttpOnly cookie auth) and renders
// next 14 days of departures + manifests. No interactivity yet — block
// actions land in B2.4, manual booking in B2.5.

function fmtDateHuman(iso) {
  try {
    return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', {
      day: 'numeric', month: 'long',
    });
  } catch { return iso; }
}
function fmtDow(dow, isoDate) {
  try {
    return new Date(isoDate + 'T00:00:00').toLocaleDateString('en-GB', {
      weekday: 'short',
    });
  } catch {
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow] || '';
  }
}
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function pickSlotCountClass(seats_taken, total_cap, is_blocked) {
  if (is_blocked) return 'blocked';
  if (total_cap <= 0) return 'blocked';
  const pct = seats_taken / total_cap;
  if (pct >= 1) return 'full';
  if (pct >= 0.75) return 'warn';
  return 'ok';
}

function renderSlot(slot, schedulingModel) {
  const showTime = schedulingModel === 'multi_slot_per_day' && slot.slot_time;
  const cls = pickSlotCountClass(slot.seats_taken, slot.total_cap, slot.is_blocked);
  const count = slot.is_blocked
    ? 'Blocked'
    : (showTime
      ? `${slot.seats_taken} / ${slot.total_cap} seats`
      : (slot.seats_taken > 0 ? 'Booked' : 'Available'));

  let manifestHtml = '';
  if (slot.bookings && slot.bookings.length) {
    manifestHtml = '<ul class="manifest">' + slot.bookings.map((b) => {
      const phone = b.customer_phone ? escapeHtml(b.customer_phone) : '';
      const email = b.customer_email ? escapeHtml(b.customer_email) : '';
      const partyLabel = b.party_size === 1 ? '1 pax' : `${b.party_size} pax`;
      return `
        <li>
          <details>
            <summary>
              <span class="name">${escapeHtml(b.customer_name) || '(unnamed)'}</span>
              <span class="party">${partyLabel}</span>
            </summary>
            <div class="contact">
              ${email}${email && phone ? ' · ' : ''}${phone}
            </div>
          </details>
        </li>`;
    }).join('') + '</ul>';
  } else if (!slot.is_blocked) {
    manifestHtml = '';   // no bookings, no list
  }

  const blockedTag = slot.is_blocked
    ? `<div class="slot-blocked-tag">${escapeHtml(slot.block_reason || 'Blocked')}</div>`
    : '';

  return `
    <div class="slot">
      <div class="slot-head">
        <span class="slot-time">${showTime ? escapeHtml(slot.slot_time) : 'Departure'}</span>
        <span class="slot-count ${cls}">${count}</span>
      </div>
      ${blockedTag}
      ${manifestHtml}
    </div>
  `;
}

function renderDay(day, isToday, schedulingModel) {
  const totalSeats = day.slots.reduce((s, sl) => s + (sl.seats_taken || 0), 0);
  const totalBookings = day.slots.reduce((s, sl) => s + (sl.bookings ? sl.bookings.length : 0), 0);
  const isEmpty = totalBookings === 0 && !day.slots.some((s) => s.is_blocked);

  const cardClass = ['day-card', isToday ? 'is-today' : '', isEmpty ? 'is-empty' : '']
    .filter(Boolean).join(' ');

  const dateLabel = `<span class="dow">${escapeHtml(fmtDow(day.dow, day.date))}</span>${escapeHtml(fmtDateHuman(day.date))}${isToday ? ' · today' : ''}`;
  const metaLabel = totalBookings === 0
    ? 'No bookings'
    : `<strong>${totalBookings}</strong> booking${totalBookings === 1 ? '' : 's'} · ${totalSeats} pax`;

  return `
    <div class="${cardClass}">
      <div class="day-head">
        <span class="day-date">${dateLabel}</span>
        <span class="day-meta">${metaLabel}</span>
      </div>
      <div class="slot-list">
        ${day.slots.map((s) => renderSlot(s, schedulingModel)).join('')}
      </div>
    </div>
  `;
}

function renderSummary(data) {
  const todayDay = data.days[0];
  const todayBookings = todayDay
    ? todayDay.slots.reduce((s, sl) => s + (sl.bookings ? sl.bookings.length : 0), 0)
    : 0;
  const totalBookings = data.days.reduce(
    (s, d) => s + d.slots.reduce((s2, sl) => s2 + (sl.bookings ? sl.bookings.length : 0), 0),
    0
  );
  const totalSeats = data.days.reduce(
    (s, d) => s + d.slots.reduce((s2, sl) => s2 + (sl.seats_taken || 0), 0),
    0
  );
  document.getElementById('sumToday').textContent       = todayBookings;
  document.getElementById('sumToday').classList.toggle('zero', todayBookings === 0);
  document.getElementById('sumBookings').textContent    = totalBookings;
  document.getElementById('sumBookings').classList.toggle('zero', totalBookings === 0);
  document.getElementById('sumSeats').textContent       = totalSeats;
  document.getElementById('sumSeats').classList.toggle('zero', totalSeats === 0);
  document.getElementById('summary').hidden = false;
}

async function loadDashboard() {
  const content = document.getElementById('dashContent');
  const notice  = document.getElementById('topNotice');
  notice.innerHTML = '';
  content.innerHTML = '<div class="spinner">Loading next 14 days…</div>';

  // me: identity for the header
  try {
    const meRes = await fetch('/api/captain?mode=me', { credentials: 'include' });
    if (meRes.status === 401) {
      window.location.href = '/captain/login?error=expired';
      return;
    }
    if (meRes.ok) {
      const j = await meRes.json();
      document.getElementById('tenantName').textContent = j.tenant_name || j.tenant || '—';
      document.getElementById('userEmail').textContent  = j.email || '—';
    }
  } catch (e) {
    notice.innerHTML = '<div class="error-banner">Could not verify session. Refresh to retry.</div>';
  }

  // dashboard data
  try {
    const res = await fetch('/api/captain?mode=dashboard-data', { credentials: 'include' });
    if (res.status === 401) {
      window.location.href = '/captain/login?error=expired';
      return;
    }
    if (!res.ok) {
      let err = 'Could not load dashboard data.';
      try { err = (await res.json()).error || err; } catch {}
      content.innerHTML = `<div class="error-banner">${escapeHtml(err)}</div>`;
      return;
    }
    const data = await res.json();
    renderSummary(data);
    const todayIso = data.today_iso;
    content.innerHTML = data.days
      .map((d) => renderDay(d, d.date === todayIso, data.scheduling_model))
      .join('');
  } catch (e) {
    content.innerHTML = '<div class="error-banner">Network error — please refresh.</div>';
    console.error('[dashboard] load failed', e);
  }
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  try {
    await fetch('/api/captain?mode=logout', { method: 'POST', credentials: 'include' });
  } catch {}
  window.location.href = '/captain/login';
});
document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

loadDashboard();
</script>

</body>
</html>
