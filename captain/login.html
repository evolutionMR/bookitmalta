<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />

<title>Sign in — BookItMalta captain dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..800&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
:root {
  --ink: #0B2545;
  --ink-soft: #1C3558;
  --paper: #F4EBD9;
  --paper-deep: #EBDFC6;
  --terracotta: #C85C2E;
  --terracotta-deep: #A64620;
  --mute: rgba(11, 37, 69, 0.55);
  --rule: rgba(11, 37, 69, 0.15);
  --rule-strong: rgba(11, 37, 69, 0.35);
  --err: #B3261E;
  --err-soft: rgba(179, 38, 30, 0.08);
  --ok-bg: #D8F3DC;
  --ok: #1B4332;
  --serif: "Fraunces", Georgia, serif;
  --sans:  "Manrope", -apple-system, sans-serif;
  --mono:  "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.55;
  font-weight: 400;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(11,37,69,0.035) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 1;
  background: #FFFAF1;
  border: 1px solid var(--rule);
  border-radius: 14px;
  max-width: 460px;
  width: 100%;
  padding: 2.4rem 2rem 2rem;
  box-shadow: 0 24px 80px rgba(11, 37, 69, 0.12);
}

.eyebrow {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--terracotta);
  margin-bottom: 0.6rem;
}

h1 {
  font-family: var(--serif);
  font-size: 1.9rem;
  font-weight: 380;
  color: var(--ink);
  line-height: 1.1;
  letter-spacing: -0.015em;
  margin-bottom: 0.6rem;
}

.subtitle {
  color: var(--ink-soft);
  font-size: 1rem;
  margin-bottom: 1.6rem;
}

.tenant-toggle {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 1.2rem;
}
.tenant-btn {
  flex: 1;
  background: white;
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 8px;
  padding: 0.7rem 1rem;
  font-family: var(--mono);
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s ease;
}
.tenant-btn[aria-selected="true"] {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

label {
  display: block;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 0.4rem;
}

input[type="email"] {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--rule-strong);
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-family: var(--sans);
  font-size: 1rem;
  color: var(--ink);
  margin-bottom: 1.2rem;
}
input[type="email"]:focus {
  outline: none;
  border-color: var(--terracotta);
  box-shadow: 0 0 0 3px rgba(200, 92, 46, 0.15);
}

button.submit {
  width: 100%;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 999px;
  padding: 0.95rem;
  font-family: var(--mono);
  font-size: 0.82rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s ease;
}
button.submit:hover { background: var(--terracotta); transform: translateY(-1px); }
button.submit:disabled { opacity: 0.5; cursor: wait; }

.notice {
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-size: 0.9rem;
  margin-bottom: 1.2rem;
  line-height: 1.5;
}
.notice.err {
  background: var(--err-soft);
  color: var(--err);
  border: 1px solid rgba(179, 38, 30, 0.25);
}
.notice.ok {
  background: var(--ok-bg);
  color: var(--ok);
  border: 1px solid rgba(27, 67, 50, 0.2);
}
.notice strong { font-weight: 600; }

.footer {
  margin-top: 1.5rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--rule);
  font-size: 0.85rem;
  color: var(--mute);
  line-height: 1.5;
}
.footer a { color: var(--terracotta); text-decoration: none; }
.footer a:hover { text-decoration: underline; }

/* Big, thumb-friendly PIN inputs (mobile-first) */
#pin, #newPin, #newPin2 {
  font-size: 1.7rem;
  letter-spacing: 0.45em;
  text-align: center;
  padding: 1.05rem 0.8rem;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  border-radius: 14px;
}
#pin::placeholder, #newPin::placeholder, #newPin2::placeholder {
  letter-spacing: normal;
  font-size: 0.95rem;
  font-family: "Manrope", -apple-system, sans-serif;
}
.submit { padding: 1.05rem; font-size: 0.9rem; border-radius: 14px; }
</style>
</head>

<body>

<div class="card">
  <div class="eyebrow">Captain dashboard</div>
  <h1>Sign in</h1>
  <p class="subtitle">Enter your email and PIN. First time? Use the PIN we sent you — you'll set your own.</p>

  <div id="notice"></div>

  <form id="loginForm" novalidate>
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@operator.com" />

    <label for="pin">PIN</label>
    <input type="password" id="pin" name="pin" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="6" placeholder="4–6 digits" />

    <button type="submit" class="submit" id="submitBtn">Sign in</button>
  </form>

  <!-- First sign-in / reset: choose a new PIN. Hidden until needed. -->
  <form id="setPinForm" novalidate style="display:none">
    <label for="newPin">Choose a new PIN</label>
    <input type="password" id="newPin" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="6" placeholder="4–6 digits" />
    <label for="newPin2">Confirm new PIN</label>
    <input type="password" id="newPin2" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="6" placeholder="repeat it" />
    <button type="submit" class="submit" id="setPinBtn">Set PIN &amp; sign in</button>
  </form>

  <div class="footer">
    <a href="#" id="forgotPin">Forgot your PIN? Email me a sign-in link instead</a><br />
    Not on your operator's allowlist? Reach out to BookItMalta and we'll add you.
  </div>
</div>

<script>
// Operator is derived server-side from the email — no picker needed.

// ---- error from URL (?error=expired / not_allowed / missing_token) ----
const params = new URLSearchParams(window.location.search);
const errMap = {
  expired:        'The sign-in link expired or had been used already. Sign in with your PIN, or request a new link.',
  missing_token:  'That sign-in link looked invalid. Sign in with your PIN, or request a new link.',
  not_allowed:    'That email isn\'t on the allowlist for this operator. If this is unexpected, contact BookItMalta.',
  unknown_tenant: 'Unknown operator. Pick one above and try again.',
};
if (params.get('error') && errMap[params.get('error')]) {
  showNotice('err', errMap[params.get('error')]);
}

// Carry the just-entered (issued) PIN into the set-PIN step so pin-set can
// re-verify it server-side as the currentPin.
let pendingCurrentPin = '';

// ---- email + PIN sign-in ----
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pin = document.getElementById('pin').value.trim();
  if (!email) return showNotice('err', 'Please enter your email address.');
  if (!/^[0-9]{4,6}$/.test(pin)) return showNotice('err', 'Your PIN is 4–6 digits.');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/captain?mode=pin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, pin }),
    });
    let data = {};
    try { data = await res.json(); } catch {}
    if (res.ok && data.ok && data.mustChange) {
      // First sign-in — show the set-PIN form.
      pendingCurrentPin = pin;
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('setPinForm').style.display = 'block';
      showNotice('ok', 'Welcome — set your own PIN to finish signing in.');
      return;
    }
    if (res.ok && data.ok) { window.location.href = '/captain/dashboard'; return; }
    showNotice('err', data.error || 'Could not sign you in. Please try again.');
    btn.disabled = false; btn.textContent = 'Sign in';
  } catch (err) {
    showNotice('err', 'Network error — please try again.');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});

// ---- set a new PIN (first sign-in / reset) ----
document.getElementById('setPinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const newPin = document.getElementById('newPin').value.trim();
  const newPin2 = document.getElementById('newPin2').value.trim();
  if (!/^[0-9]{4,6}$/.test(newPin)) return showNotice('err', 'Your new PIN must be 4–6 digits.');
  if (newPin !== newPin2) return showNotice('err', 'The two PINs don\'t match.');

  const btn = document.getElementById('setPinBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/captain?mode=pin-set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, currentPin: pendingCurrentPin, newPin }),
    });
    let data = {};
    try { data = await res.json(); } catch {}
    if (res.ok && data.ok) { window.location.href = '/captain/dashboard'; return; }
    showNotice('err', data.error || 'Could not save your PIN. Please try again.');
    btn.disabled = false; btn.textContent = 'Set PIN & sign in';
  } catch (err) {
    showNotice('err', 'Network error — please try again.');
    btn.disabled = false; btn.textContent = 'Set PIN & sign in';
  }
});

// ---- forgot PIN → magic-link fallback ----
document.getElementById('forgotPin').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  if (!email) return showNotice('err', 'Enter your email first, then tap “Forgot your PIN”.');
  try {
    await fetch('/api/captain?mode=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    showNotice('ok', '<strong>Check your inbox.</strong> If <code>' + escapeHtml(email) + '</code> is on the allowlist, a one-time sign-in link will arrive shortly (expires in 15 minutes). You can reset your PIN once you\'re in.');
  } catch (err) {
    showNotice('err', 'Network error — please try again.');
  }
});

function showNotice(kind, html) {
  const el = document.getElementById('notice');
  el.innerHTML = '<div class="notice ' + kind + '">' + html + '</div>';
}
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
</script>

</body>
</html>
